<div class="add-expense-page">

  <!-- Page Title -->
  <div class="page-header">
    <h2>{{ t.translate('addExpensePageTitle') }}</h2>
    <p>{{ t.translate('addExpensePageSubtitle') }}</p>
  </div>

  <!-- Expense Card -->
  <mat-card class="expense-card">

    <div class="form-grid">

      <!-- Amount -->
      <div class="form-group">
        <label>
          {{ t.translate('amount') }} <span class="required">{{ t.translate('required') }}</span>
        </label>

        <mat-form-field appearance="outline">
          <span matTextPrefix>₹&nbsp;</span>

          <input
            matInput
            type="number"
            [placeholder]="t.translate('enterAmount')"
            [(ngModel)]="expense.amount">
        </mat-form-field>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label>
          {{ t.translate('category') }} <span class="required">{{ t.translate('required') }}</span>
        </label>

        <mat-form-field appearance="outline">

          <mat-select
            [placeholder]="t.translate('selectCategory')"
            [(ngModel)]="expense.category">

            <mat-option
              *ngFor="let category of categories"
              [value]="category">

              {{category}}

            </mat-option>

          </mat-select>

        </mat-form-field>
      </div>

      <!-- Date -->
      <div class="form-group">

        <label>
          {{ t.translate('date') }} <span class="required">{{ t.translate('required') }}</span>
        </label>

        <mat-form-field appearance="outline">

          <input
            matInput
            [matDatepicker]="picker"
            [(ngModel)]="expense.date">

          <mat-datepicker-toggle
            matSuffix
            [for]="picker">
          </mat-datepicker-toggle>

          <mat-datepicker #picker></mat-datepicker>

        </mat-form-field>

      </div>

     <!-- Time -->

<div class="form-group">

  <label>
    {{ t.translate('time') }} <span class="required">{{ t.translate('required') }}</span>
  </label>

  <div class="time-grid">

    <!-- Hour -->

    <mat-form-field appearance="outline">

      <mat-select
        [placeholder]="t.translate('hour')"
        [(ngModel)]="expense.hour">

        <mat-option
          *ngFor="let hour of hours"
          [value]="hour">

          {{ hour }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- Minute -->

    <mat-form-field appearance="outline">

      <mat-select
        [placeholder]="t.translate('minute')"
        [(ngModel)]="expense.minute">

        <mat-option
          *ngFor="let minute of minutes"
          [value]="minute">

          {{ minute }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <!-- AM / PM -->

    <mat-form-field appearance="outline">

      <mat-select
        [placeholder]="t.translate('meridian')"
        [(ngModel)]="expense.meridian">

        <mat-option
          *ngFor="let meridian of meridians"
          [value]="meridian">

          {{ meridian }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </div>

</div>

      <!-- Payment Mode -->
      <div class="form-group">

        <label>{{ t.translate('paymentMode') }}</label>

        <mat-form-field appearance="outline">

          <mat-select
            [placeholder]="t.translate('selectPaymentMode')"
            [(ngModel)]="expense.paymentMode">

            <mat-option
              *ngFor="let payment of paymentModes"
              [value]="payment">

              {{payment}}

            </mat-option>

          </mat-select>

        </mat-form-field>

      </div>

      <!-- Description -->
      <div class="form-group full-width">

        <label>{{ t.translate('description') }}</label>

        <mat-form-field appearance="outline">

          <textarea
            matInput
            rows="4"
            maxlength="200"
            [placeholder]="t.translate('enterDescription')"
            [(ngModel)]="expense.description">
          </textarea>

          <mat-hint align="end">
            {{ expense.description?.length || 0 }}/200
          </mat-hint>

        </mat-form-field>

      </div>

    </div>

    <!-- Action Buttons -->

    <div class="action-buttons">

      <button
        mat-stroked-button
        type="button"
        class="cancel-btn"
        (click)="cancel()">

        {{ t.translate('cancel') }}

      </button>

      <button
        mat-raised-button
        color="primary"
        class="save-btn"
        type="button"
        (click)="saveExpense()">

        {{ t.translate('saveExpense') }}

      </button>

    </div>

  </mat-card>

</div>
